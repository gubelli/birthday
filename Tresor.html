<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Der verzauberte Geburtstagstresor Deluxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout: a storybook that turns one page at a time under an aurora night sky; a peek into each riddle's story between pages, staggered entrances, flying letters. Deliberately dark, single theme. */
:root{
  --night:#24091f; --dusk:#45123d; --ink:#fff1f6; --muted:#f0bfd6;
  --gold:#f7b5cd; --gold-deep:#c45a86; --rose:#ff5fa2; --ok:#8fd6a8; --sea:#c3a6ff; --violet:#b04f9a;
  --display:"Cinzel Decorative","Cinzel",Georgia,serif;
  --label:"Cinzel",Georgia,serif;
  --body:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.5;overflow-x:hidden}
/* aurora */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:.5;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:40vmax;left:5%;top:0;background:radial-gradient(closest-side,#a02f7a,color-mix(in srgb,#a02f7a 35%,transparent) 55%,transparent)}
.aurora i:nth-child(2){width:50vmax;height:35vmax;right:0;top:10%;background:radial-gradient(closest-side,#7a2f8b,color-mix(in srgb,#7a2f8b 35%,transparent) 55%,transparent);animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){width:45vmax;height:30vmax;left:30%;top:35%;background:radial-gradient(closest-side,#c2406f,color-mix(in srgb,#c2406f 35%,transparent) 55%,transparent);animation-duration:34s;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2) rotate(25deg)}}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0} #fx{z-index:8}
/* transitions: approach the castle gate, a scene from the next riddle's story, or a torch-lit hall to the vault */
#walk{position:fixed;inset:0;z-index:7;pointer-events:none}
#hall,.outside,.veil,.flare{position:absolute;inset:0;width:100%;height:100%}
#hall{opacity:0}
.veil{background:radial-gradient(ellipse at 50% 70%,var(--dusk),var(--night) 70%);opacity:0}
.flare{background:radial-gradient(circle at 50% 46%,#fff3f8,#ffc4dc 45%,var(--gold));opacity:0}
.outside>.vault{position:absolute}
.walking .wrap,.walking .aurora,.walking #sky{visibility:hidden}
/* opening curtain: velvet folds with a satin sheen, gold trim, fringe and a pleated valance. Only transform and
   opacity animate, on textures painted once. The valance's top edge stays night because Safari tints the iPhone status bar from it */
#curtain{position:fixed;inset:0;z-index:7;display:flex;pointer-events:none;overflow:hidden}
#curtain b{position:relative;flex:1;overflow:hidden;will-change:transform,opacity;
  background:linear-gradient(180deg,rgba(26,0,16,.6),transparent 24%,transparent 72%,rgba(26,0,16,.55)),
    repeating-linear-gradient(90deg,#5e1238 0,#9c2a5e 9px,#e2649c 15px,#ffb8d3 17px,#e2649c 19px,#9c2a5e 26px,#5e1238 36px)}
#curtain b:first-of-type{transform-origin:0 50%;box-shadow:inset -3px 0 0 var(--gold)}
#curtain b:last-of-type{transform-origin:100% 50%;box-shadow:inset 3px 0 0 var(--gold)}
#curtain b::before{content:"";position:absolute;inset:0 -70%;background:linear-gradient(100deg,transparent 38%,rgba(255,236,246,.5) 50%,transparent 62%);transform:translateX(-62%);will-change:transform}
#curtain b::after{content:"";position:absolute;inset:auto 0 0;height:22px;opacity:.95;
  background:linear-gradient(var(--gold),var(--gold)) top/100% 4px no-repeat,repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 5px) bottom/100% 18px no-repeat}
#curtain .val{position:absolute;inset:0 0 auto;height:70px;will-change:transform;
  background:radial-gradient(circle,#fff0f6 0 2.5px,transparent 3px) 0 44px/18px 8px repeat-x,
    linear-gradient(transparent 38px,var(--gold) 38px 41px,transparent 41px),
    repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,200,226,.2) 26px 30px,transparent 30px 56px),
    linear-gradient(180deg,var(--night),#7a1d4a 34%,#b8336f 72%,#9c2a5e);
  -webkit-mask:linear-gradient(#000,#000) top/100% 56px no-repeat,radial-gradient(circle 17px at 50% 0,#000 97%,transparent) bottom/34px 14px repeat-x;
  mask:linear-gradient(#000,#000) top/100% 56px no-repeat,radial-gradient(circle 17px at 50% 0,#000 97%,transparent) bottom/34px 14px repeat-x}
#curtain .val svg{position:absolute;left:50%;top:14px;width:30px;margin-left:-15px;filter:drop-shadow(0 0 6px var(--gold))}
#curtain.open b::before{animation:sheen 1.1s ease-in-out forwards}
#curtain.open b:first-of-type{animation:drawL 1.9s .35s cubic-bezier(.6,0,.2,1) forwards}
#curtain.open b:last-of-type{animation:drawR 1.9s .35s cubic-bezier(.6,0,.2,1) forwards}
#curtain.open .val{animation:valUp 1.1s 1.1s cubic-bezier(.6,0,.3,1) forwards}
@keyframes sheen{to{transform:translateX(62%)}}
@keyframes drawL{12%{transform:translateX(1.5%)}70%{opacity:1}to{transform:translateX(-18%) scaleX(.16);opacity:0}}
@keyframes drawR{12%{transform:translateX(-1.5%)}70%{opacity:1}to{transform:translateX(18%) scaleX(.16);opacity:0}}
@keyframes valUp{to{transform:translateY(-115%)}}
.wrap{position:relative;z-index:1;box-sizing:border-box;min-height:100%;max-width:560px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-direction:column;align-items:center;gap:8px}
.eyebrow{font-family:var(--label);letter-spacing:.22em;text-transform:uppercase;font-size:.76rem;color:var(--gold)}
.letters{display:flex;justify-content:center;gap:8px}
.slot{width:42px;height:50px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--gold);background:color-mix(in srgb,var(--night) 70%,transparent);transition:transform .5s,box-shadow .5s;position:relative;overflow:hidden}
.slot::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,225,238,.55) 50%,transparent 70%);transform:translateX(-120%)}
.slot.lit{box-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-3px)}
.slot.lit::after{animation:shine 3.5s ease-in-out infinite}
.slot.lit:nth-child(2)::after{animation-delay:.25s}.slot.lit:nth-child(3)::after{animation-delay:.5s}.slot.lit:nth-child(4)::after{animation-delay:.75s}.slot.lit:nth-child(5)::after{animation-delay:1s}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.slot.pop{animation:pop .8s ease}
@keyframes pop{40%{transform:scale(1.45) translateY(-8px) rotate(-6deg);box-shadow:0 0 30px var(--gold)}}
.flyer{position:fixed;z-index:9;font-family:var(--display);color:var(--gold);font-size:2.4rem;text-shadow:0 0 18px var(--gold),0 0 40px var(--rose);pointer-events:none}
/* header + card fill exactly the visible screen; the restart button waits below the fold */
.screen{display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.stage{position:relative;flex:1;perspective:1200px;display:flex;flex-direction:column}
.stage>.page{flex:1;justify-content:center}
.page{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:18px 18px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--dusk) 88%,transparent),color-mix(in srgb,var(--night) 92%,transparent));box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 6px color-mix(in srgb,var(--night) 60%,transparent);position:relative;overflow:hidden;transform-style:preserve-3d}
.page > *{animation:enter .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*120ms + 150ms)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96);filter:blur(6px)}}
.page.shake{animation:shake .5s}
@keyframes shake{15%,55%{transform:translateX(-10px) rotate(-1deg)}35%,75%{transform:translateX(10px) rotate(1deg)}}
.page.wrong{box-shadow:0 0 0 2px var(--rose),0 0 40px color-mix(in srgb,var(--rose) 50%,transparent)}
.artbox{width:min(100%,280px,30vh);width:min(100%,280px,30dvh);transition:transform .25s ease-out;transform-style:preserve-3d}
.art{width:100%;height:auto;overflow:visible;display:block;will-change:transform}
.artbox.wide{width:min(100%,360px,38vh);width:min(100%,360px,38dvh)}
.bigcastle .gL,.bigcastle .gR{transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.bigcastle.open .gL,.bigcastle.open .gR{transform:scaleX(.06)}
.bigcastle .spill{opacity:0;transition:opacity 1.2s .3s}
.bigcastle.open .spill{opacity:1}
.dust{stroke-dasharray:1.5 7;animation:dust 2.4s linear infinite}
@keyframes dust{to{stroke-dashoffset:-34}}
.word{white-space:nowrap;display:inline-block}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
/* "Geburtstagstresor" is about 12.2em wide: size it so the card keeps ~25px either side */
h1{font-size:clamp(1.4rem,calc((100vw - 80px) / 12.2),2.6rem)}
h2{font-size:clamp(1.35rem,5.5vw,1.8rem);color:var(--gold)}
.ch{display:inline-block;background:linear-gradient(180deg,#fff0f6,var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both,wave 3.2s ease-in-out infinite;animation-delay:calc(var(--c)*55ms + 400ms),calc(var(--c)*90ms + 1.6s)}
h2 .ch{background:none;color:var(--gold);-webkit-background-clip:initial;background-clip:initial}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-20deg) scale(.4);filter:blur(4px)}}
@keyframes wave{50%{transform:translateY(-4px)}}
.lead{margin:0;max-width:34ch;font-size:1.08rem;color:var(--muted);font-style:italic}
.verse{margin:0;font-size:1.15rem;line-height:1.42;max-width:32ch;display:flex;flex-direction:column}
.verse span{animation:line 1s ease both;animation-delay:calc(var(--l)*380ms + 700ms)}
.verse span:last-child{color:var(--gold);font-style:italic}
@keyframes line{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:380px}
input{flex:1 1 170px;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:6px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--night);color:var(--ink);text-align:center;transition:box-shadow .3s,border-color .3s}
input::placeholder{color:var(--muted);opacity:1}
input:focus{border-color:var(--gold);box-shadow:0 0 20px color-mix(in srgb,var(--gold) 35%,transparent)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:var(--label);font-weight:700;letter-spacing:.08em;font-size:.85rem;padding:11px 18px;border-radius:6px;border:0;cursor:pointer;background:linear-gradient(110deg,var(--gold-deep),var(--gold) 40%,#fff0f6 50%,var(--gold) 60%,var(--gold-deep));background-size:250% 100%;color:var(--night);transition:transform .2s,box-shadow .2s;animation:btn 3s linear infinite}
@keyframes btn{to{background-position:-250% 0}}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 22px color-mix(in srgb,var(--gold) 60%,transparent)}
button.ghost{background:transparent;color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);animation:none}
button.big{font-size:1rem;padding:14px 24px;box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent);animation:btn 3s linear infinite,pulse 2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px transparent}}
.feedback{margin:0;min-height:1.5em;font-style:italic;color:var(--muted)}
.feedback.bad{color:var(--rose)} .feedback.good{color:var(--ok)}
.hint{margin:0;font-size:1.05rem;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent);padding-top:8px;max-width:32ch;animation:enter .6s both}
.sign{font-style:italic;color:var(--rose);font-size:1.35rem!important}
.reveal p{margin:0;max-width:36ch;font-size:1.2rem}
.foot{display:flex;justify-content:center;padding-top:96px}
.foot button{font-size:.75rem;padding:8px 12px}
/* illustration motion */
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sway{transform-origin:top center;animation:sway 3.6s ease-in-out infinite}
.sway.b{animation-duration:4.4s;animation-delay:-1s}.sway.c{animation-duration:3.1s;animation-delay:-2s}
@keyframes sway{50%{transform:rotate(4deg)}}
.rise{animation:rise 7s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(-120px);opacity:0}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.55}}
.smoke{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 3.5s ease-in-out infinite}
@keyframes draw{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-220;opacity:0}}
.bubble{animation:bubble 4.5s ease-in infinite}
@keyframes bubble{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-110px);opacity:0}}
.fall{animation:fall 6s linear infinite}
@keyframes fall{from{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:1}to{transform:translate(-40px,130px) rotate(260deg);opacity:0}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
/* vault door: frame, light core, rays, two leaves that swing out in 3D, a lock dial on the seam */
.vault{position:relative;width:100%;aspect-ratio:240/170;perspective:700px}
.vault>*{position:absolute}
.vf{inset:0;width:100%;height:100%;overflow:visible}
.core,.leaf{left:25.833%;top:14.118%;width:48.333%;height:85.882%}
.core{border-radius:50% 50% 0 0/39.73% 39.73% 0 0;background:radial-gradient(ellipse at 50% 62%,#fff5fa,#ffc9de 35%,var(--gold) 70%,var(--gold-deep));opacity:0;transition:opacity .6s}
.heartc{position:absolute;left:33%;top:40%;width:34%;height:auto}
.rays{left:50%;top:64.7%;width:320%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,210,230,.3) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 12%,transparent 70%);mask:radial-gradient(closest-side,#000 12%,transparent 70%);opacity:0;transition:opacity 1.2s .3s;pointer-events:none}
.leaf{width:24.167%;transition:transform 1.5s cubic-bezier(.45,0,.15,1)}
.leaf.l{transform-origin:0 50%}
.leaf.r{left:50%;transform-origin:100% 50%}
.leaf svg,.dial svg{display:block;width:100%;height:100%;overflow:visible}
.leaf .band{transition:stroke .5s}
.seam{left:calc(50% - 1px);top:14.118%;width:2px;height:85.882%;background:#fff0f6;box-shadow:0 0 10px 3px rgba(255,180,215,.85);opacity:0;transition:opacity .5s}
.dial{left:50%;top:65.88%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);transition:opacity .4s,transform .5s}
.vault.unlock .core,.vault.unlock .seam{opacity:1}
.vault.unlock .band{stroke:#ffd6e8}
.vault.open .leaf.l{transform:rotateY(-112deg)}
.vault.open .leaf.r{transform:rotateY(112deg)}
.vault.open .seam{opacity:0}
.vault.open .dial{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
.vault.open .rays{opacity:1;animation:rays 14s linear infinite}
.vault.open .heartc{animation:beat 1.1s ease-in-out infinite}
@keyframes rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes beat{30%{transform:scale(1.14)}60%{transform:scale(.98)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#curtain{display:none}}
</style>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="sky" class="fx" aria-hidden="true"></canvas>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<div id="walk" hidden aria-hidden="true"><canvas id="hall"></canvas><div class="outside"></div></div>

<main class="wrap" lang="de">

</main>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
const solvedCount=()=>Math.min(N,Math.max(0,pageIx-1));
const stage=document.getElementById("stage");

function letters(popIx){
  const L=document.getElementById("letters");L.innerHTML="";
  const word=pageIx===7?FINAL.toUpperCase():null;
  R.forEach((r,i)=>{const s=document.createElement("div");const on=word||i<solvedCount()&&i!==popIx;s.className="slot"+(on?" lit":"");s.textContent=word?word[i]:on?r.l:"?";L.appendChild(s)});
  document.getElementById("step").textContent=pageIx===0?"Eine Geburtstagsquest · fünf Siegel":pageIx<=N?`Siegel ${pageIx} von ${N}`:pageIx===6?"Die Tresortür":"Der Tresor ist offen";
}
// close the iPhone keyboard and scroll up; Safari can shift the page again once the keyboard has gone, so scroll once more then
function toTop(){
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  window.scrollTo({top:0,behavior:still?"auto":"smooth"});
  return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;window.scrollTo({top:0});res()};
    if(window.visualViewport)visualViewport.addEventListener("resize",()=>setTimeout(fin,300),{once:true});
    setTimeout(fin,650)})
}
function stagger(p){[...p.children].forEach((c,i)=>c.style.setProperty("--i",i))}
function tilt(p){const box=p.querySelector(".artbox");if(!box||still)return;
  p.addEventListener("pointermove",e=>{const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;box.style.transform=`rotateY(${x*18}deg) rotateX(${-y*14}deg) translateZ(20px)`});
  p.addEventListener("pointerleave",()=>box.style.transform="")}
function wrong(p,fb,msg){fb.className="feedback bad";fb.textContent=msg;p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake","wrong");setTimeout(()=>p.classList.remove("wrong"),900)}

function build(ix){
  const p=document.createElement("section");p.className="page";
  if(ix===0){
    p.innerHTML=`<div class="artbox wide">${bigCastle("h")}</div><h1>${chars("Der verzauberte")}<br>${chars("Geburtstagstresor")}</h1><p class="lead">Irgendwo in deinen Lieblingsgeschichten ist ein Geschenk eingeschlossen. Brich fünf Siegel, indem du die Figur in jedem Rätsel errätst. Jedes Siegel schenkt dir einen Buchstaben.</p><button class="big" id="go">Das Märchen beginnt</button>`;
    p.querySelector("#go").onclick=()=>go(1);
  } else if(ix<=N){
    const r=R[ix-1];
    p.innerHTML=`<div class="artbox">${ART[r.art]}</div><span class="eyebrow">Siegel ${ix} · ${r.t}</span><p class="verse"></p><form><input id="ans" placeholder="Name der Figur" autocomplete="off" aria-label="Antwort"><button>Siegel brechen</button><button type="button" class="ghost" id="tip">Tipp</button></form><p class="feedback" aria-live="polite"></p>`;
    const v=p.querySelector(".verse");r.v.split("\n").forEach((t,i)=>{const s=document.createElement("span");s.style.setProperty("--l",i);s.textContent=t;v.appendChild(s)});
    const f=p.querySelector("form"),fb=p.querySelector(".feedback"),inp=f.querySelector("input");
    f.onsubmit=async e=>{e.preventDefault();const val=norm(inp.value);
      if(r.a.some(a=>norm(a)===val)){fb.className="feedback good";fb.textContent="Siegel gebrochen! Du erhältst den Buchstaben "+r.l+".";const up=toTop();f.querySelectorAll("button,input").forEach(x=>x.disabled=true);
        await up;const ir=inp.getBoundingClientRect();sparkleBurst(90,ir.left+ir.width/2,ir.top);await flyLetter(r.l,ir,ix-1);await wait(500);go(ix+1,ix-1)}
      else wrong(p,fb,val?"Das Siegel hält. Versuch einen anderen Namen.":"Gib zuerst einen Namen ein.")};
    p.querySelector("#tip").onclick=()=>{if(!p.querySelector(".hint")){const h=document.createElement("p");h.className="hint";h.textContent="Tipp: "+r.h;p.appendChild(h)}};
  } else if(ix===6){
    p.innerHTML=`<div class="artbox">${vaultDoor()}</div><h2>${chars("Die Tresortür")}</h2><p class="lead">Alle fünf Siegel sind gebrochen. Ordne deine Buchstaben zu dem Wort, aus dem Wünsche gemacht sind, und sprich es an der Tür aus.</p><form><input id="final" placeholder="Das Zauberwort" autocomplete="off" aria-label="Zauberwort"><button>Öffnen</button></form><p class="feedback" aria-live="polite"></p>`;
    const f=p.querySelector("form"),fb=p.querySelector(".feedback");
    f.onsubmit=async e=>{e.preventDefault();
      if(norm(f.querySelector("input").value)===FINAL){const up=toTop();f.querySelectorAll("button,input").forEach(x=>x.disabled=true);fb.className="feedback good";fb.textContent="Die Tür öffnet sich …";
        if(still){go(7,null,true);return}
        await up;await spellWord();await wait(450);await openVault(p.querySelector(".vault"))}
      else wrong(p,fb,"Die Tür rührt sich nicht. Tipp: Man hat ihn nachts, und manchmal wird er wahr.")};
  } else {
    p.classList.add("reveal");
    p.innerHTML=`<div class="artbox wide">${bigCastle("v",true)}</div><span class="eyebrow">Der Tresor ist offen</span><h2>${chars("Alles Liebe zum Geburtstag,")}<br>${chars("mein Schatz")}</h2><p>Du hast jedes Rätsel gelöst, so wie du jeden gewöhnlichen Tag ein bisschen verzauberst. Ich wünsche dir für dieses Jahr Abenteuer, die einen ganzen Film füllen, Lachen in jedem Kapitel und ein Happy End, das einfach weitergeht.</p><p>Hör nie auf, gross zu träumen. Ich bin bei jedem deiner Träume an deiner Seite.</p><p class="sign">In Liebe, Fabian</p><button id="more">Noch mehr Feuerwerk</button>`;
    p.querySelector("#more").onclick=()=>{fireworks(6);hearts(30)};
  }
  stagger(p);tilt(p);return p;
}

// the scrambled seals swap places until they spell the magic word
function spellWord(){return new Promise(res=>{
  const slots=[...document.querySelectorAll(".slot")],word=FINAL.toUpperCase(),rects=slots.map(s=>s.getBoundingClientRect());let n=0;
  slots.forEach((s,i)=>{const dx=rects[word.indexOf(s.textContent)].left-rects[i].left,dy=dx>0?-26:dx<0?26:-8;
    s.animate([{transform:"none"},{transform:`translate(${dx/2}px,${dy}px) scale(1.18)`},{transform:`translate(${dx}px,0)`}],{duration:950,delay:i*90,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"}).onfinish=()=>{

})}

    const col=(c,z)=>{const k=Math.exp(-(z-cam)/6),w=.6*Math.exp(-(zEnd-z)/1.5);return`rgb(${c.map((x,i)=>(x*k+th.fog[i]*(1-k))*(1-w)+GOLD[i]*w|0)})`};
    // h lifts a point for stairs; turn bends the corridor away the further ahead it is
    const P=(x,y,z,h=climb*z)=>{const d=z-cam,s=f/d;return[cx+(x+turn*d*d)*s,cy+(y-h+climb*cam)*s]};
    const poly=(pts,fill)=>{hc.fillStyle=fill;hc.beginPath();for(const p of pts){const[a,b]=P(...p);hc.lineTo(a,b)}hc.fill()};
    const face=(z,aw,sp,shape,fill,trim)=>{const s=f/(z-cam),R=aw*s,[l,tp]=P(-HW,CE,z),[r,bt]=P(HW,FL+Math.abs(climb),z),[ax,sy]=P(0,sp,z);
      const hole=()=>{if(shape==="moon"){hc.moveTo(ax+R,sy);hc.arc(ax,sy,R,0,6.2832);return}
        hc.moveTo(ax-R,bt);hc.lineTo(ax-R,sy);
        if(shape==="pointed"){hc.quadraticCurveTo(ax-R,sy-R*.95,ax,sy-R*1.55);hc.quadraticCurveTo(ax+R,sy-R*.95,ax+R,sy)}else hc.arc(ax,sy,R,Math.PI,0);

      hc.beginPath();hc.rect(l,tp,r-l,bt-tp);hole();hc.closePath();hc.fillStyle=fill;hc.fill("evenodd");

    const lamp=(x,y,qx,qy,s,fl,z)=>{hc.fillStyle=col([196,90,134],z);hc.beginPath();hc.arc(x,y,.06*s,0,6.29);hc.fill();
      hc.fillStyle=th.fl;hc.beginPath();hc.ellipse(qx,qy,.07*s,.14*s*fl,0,0,6.29);hc.fill();
      hc.fillStyle=th.fl2;hc.beginPath();hc.ellipse(qx,qy+.04*s,.03*s,.07*s*fl,0,0,6.29);hc.fill()};
    hc.setTransform(1,0,0,1,0,0);hc.fillStyle="#fff0f6";hc.fillRect(0,0,W,H);
    hc.translate(W/2,H/2);hc.rotate(Math.sin(ph)*.008*v);hc.translate(-W/2,-H/2);
    face(zEnd,DW,DS,"round",col(th.wall.map(x=>x*1.6),zEnd),col(th.trim,zEnd));
    const open=smooth(.42,.8,t),swing=open*1.4;
    {const s=f/(zEnd-cam),[ax,sy]=P(0,DS,zEnd),[,bt]=P(0,FL,zEnd),R=DW*s;
      hc.save();hc.beginPath();hc.moveTo(ax-R,bt);hc.lineTo(ax-R,sy);hc.arc(ax,sy,R,Math.PI,0);hc.lineTo(ax+R,bt);hc.closePath();hc.clip();
      for(const sx of[-1,1]){const hx=sx*DW,ex=hx-sx*(DW-.012)*Math.cos(swing),ez=zEnd+(DW-.012)*Math.sin(swing),top=DS-DW;
        poly([[hx,top,zEnd],[ex,top,ez],[ex,FL,ez],[hx,FL,zEnd]],col(th.wall.map(x=>x*1.25),zEnd));
        for(const y of[-.15,.75])poly([[hx,y-.04,zEnd],[ex,y-.04,ez],[ex,y+.04,ez],[hx,y+.04,zEnd]],col(th.trim,zEnd))}
      hc.restore()}
    const glows=[];
    // painter's order: slice [z,z+1] far to near, then whatever sits on its near edge
    for(let z=Math.ceil(zEnd)-1;z>=Math.floor(cam);z--){
      const a=Math.max(z,cam+NEAR),b=Math.min(z+1,zEnd),c=z+.5,ft=climb*c,lo=FL+Math.abs(climb)+.1;if(b<=a)continue;
      poly([[-HW,FL,a,ft],[HW,FL,a,ft],[HW,FL,b,ft],[-HW,FL,b,ft]],col(th.floor[z&1],c));
      poly([[-.5,FL,a,ft],[.5,FL,a,ft],[.5,FL,b,ft],[-.5,FL,b,ft]],col(th.carpet,c));
      for(const sx of[-1,1]){
        poly([[sx*.5,FL,a,ft],[sx*.57,FL,a,ft],[sx*.57,FL,b,ft],[sx*.5,FL,b,ft]],col(th.trim,c));
        poly([[sx*HW,CE,a],[sx*HW,lo,a],[sx*HW,lo,b],[sx*HW,CE,b]],col(th.wall,c));
        poly([[sx*HW,-.24,a],[sx*HW,-.17,a],[sx*HW,-.17,b],[sx*HW,-.24,b]],col(th.rail,c))}
      poly([[-HW,CE,a],[HW,CE,a],[HW,CE,b],[-HW,CE,b]],col(th.ceil,c));
      const tz=z+.5;
      if(z%L===1&&tz>cam+NEAR&&tz<zEnd)for(const sx of[-1,1]){
        const s=f/(tz-cam),fl=.85+.15*Math.sin(now/70+z*5+sx),lx=sx*(HW-.12),[ux,uy]=P(lx,-.8,tz),[qx,qy]=P(lx,-.97,tz);
        poly([[sx*HW,-.78,tz],[lx,-.82,tz],[lx,-.76,tz],[sx*HW,-.6,tz]],col([196,90,134],tz));
        lamp(ux,uy,qx,qy,s,fl,tz);glows.push([lx,-.97,tz,fl])}
      const z1=z+.45,z2=z+1.05,zm=(z1+z2)/2;
      if(th.banners&&z%L===0&&z1>cam+NEAR&&z2<zEnd)for(const sx of[-1,1]){
        const x=sx*(HW-.01),bc=th.banners[(z/L+(sx>0))%2];
        poly([[x,-2.25,z1],[x,-2.25,z2],[x,-1.05,z2],[x,-.82,zm],[x,-1.05,z1]],col(bc,zm));
        poly([[x,-2.3,z1-.04],[x,-2.3,z2+.04],[x,-2.2,z2+.04],[x,-2.2,z1-.04]],col(th.trim,zm));
        const[ex,ey]=P(x,-1.55,zm);hc.fillStyle=col(th.trim,zm);hc.beginPath();hc.arc(ex,ey,.08*f/(zm-cam),0,6.29);hc.fill()}
      // climbing: the step up at the slice's near edge faces us
      if(climb>0&&z>cam+NEAR){const r0=climb*(c-1);
        poly([[-HW,FL,z,r0],[HW,FL,z,r0],[HW,FL,z,ft],[-HW,FL,z,ft]],col(th.floor[0].map(x=>x*.7),z));
        poly([[-.5,FL,z,r0],[.5,FL,z,r0],[.5,FL,z,ft],[-.5,FL,z,ft]],col(th.carpet.map(x=>x*.75),z))}
      if(z%L===0&&z>cam+NEAR&&z<zEnd-.3){face(z+.32,AW,SP,th.arch,col(th.stone.map((x,i)=>x*.35+th.wall[i]*.45),z+.32));face(z,AW,SP,th.arch,col(th.stone,z),col(th.trim,z))}
    }
    hc.globalCompositeOperation="lighter";
    const gc=th.glow.join(",");
    for(const[x,y,z,fl]of glows){const[a,b]=P(x,y,z),rad=1.2*f/(z-cam),g=hc.createRadialGradient(a,b,0,a,b,rad),fog=Math.exp(-(z-cam)/6);
      g.addColorStop(0,`rgba(${gc},${.42*fl*fog})`);g.addColorStop(1,`rgba(${gc},0)`);hc.fillStyle=g;hc.fillRect(a-rad,b-rad,rad*2,rad*2);
      // its reflection: a soft streak on the floor below, stretched towards us
      const[fx2,fy2]=P(x*.8,FL,z),rr=.3*f/(z-cam),rg=hc.createRadialGradient(0,0,0,0,0,rr);
      rg.addColorStop(0,`rgba(${gc},${.3*fl*fog})`);rg.addColorStop(1,`rgba(${gc},0)`);
      hc.save();hc.translate(fx2,fy2);hc.scale(1,3.2);hc.fillStyle=rg;hc.fillRect(-rr,-rr,rr*2,rr*2);hc.restore()}
    {const[,db]=P(0,FL,zEnd),near=cam+NEAR+.05,[,nb]=P(0,FL,near),g=hc.createLinearGradient(0,db,0,nb);
      g.addColorStop(0,`rgba(255,214,232,${.42*(.25+.75*open)})`);g.addColorStop(1,"rgba(255,214,232,0)");
      poly([[-DW*.85,FL,zEnd],[DW*.85,FL,zEnd],[1.15,FL,near],[-1.15,FL,near]],g)}
    {const[a,b]=P(0,.2,zEnd),rad=2.4*f/(zEnd-cam),g=hc.createRadialGradient(a,b,0,a,b,rad);
      g.addColorStop(0,`rgba(255,214,232,${.55*(.35+.65*open)})`);g.addColorStop(1,"rgba(255,214,232,0)");hc.fillStyle=g;hc.fillRect(a-rad,b-rad,rad*2,rad*2)}
    // drifting dust
    hc.fillStyle=th.mc;
    for(const p of motes){while(p.z<cam+NEAR)p.z+=12;const dz=p.z-cam;if(p.z>zEnd)continue;
      const[a,b]=P(p.x,p.y-2.3+Math.sin(now/900+p.p)*.1,p.z);hc.globalAlpha=Math.min(1,dz/1.5)*Math.exp(-dz/7)*(.5+.5*Math.sin(now/200+p.p));
      hc.beginPath();hc.arc(a,b,Math.max(.8,.018*f/dz),0,6.29);hc.fill()}
    hc.globalAlpha=1;hc.globalCompositeOperation="source-over";
    hc.setTransform(1,0,0,1,0,0);hc.fillStyle=vignette;hc.fillRect(0,0,W,H);
    // golden light floods in as we reach the far door
    const sh=smooth(.7,1,t);
    if(sh>0){hc.setTransform(1,0,0,1,0,0);const g=hc.createRadialGradient(W/2,H*.46,0,W/2,H*.46,Math.hypot(W,H)*.55);

})}

// sky: stars + shooting stars
const sky=document.getElementById("sky"),sc=sky.getContext("2d");let stars=[],shoot=null;
function sizeSky(){const d=Math.min(devicePixelRatio||1,2);sky.width=innerWidth*d;sky.height=innerHeight*d;stars=Array.from({length:Math.round(innerWidth*innerHeight/4000)},()=>({x:Math.random()*sky.width,y:Math.random()*sky.height,r:(Math.random()*1.4+.3)*d,p:Math.random()*6.28}))}
let skyLast=0;
function drawSky(t){
  if(!still){requestAnimationFrame(drawSky);
    // stars twinkle slowly, so ~30fps is plenty unless a shooting star is crossing; nothing shows behind the hallway
    if((!shoot&&t-skyLast<30)||document.body.classList.contains("walking"))return}
  skyLast=t;sc.clearRect(0,0,sky.width,sky.height);
  for(const s of stars){sc.globalAlpha=.3+.6*Math.sin(t/900+s.p)**2;sc.fillStyle="#ffe1ee";sc.beginPath();sc.arc(s.x,s.y,s.r,0,6.28);sc.fill()}
  if(!still){if(!shoot&&Math.random()<.008)shoot={x:Math.random()*sky.width*.7,y:Math.random()*sky.height*.35,l:0};
    if(shoot){shoot.l++;const d=sky.width/innerWidth,x=shoot.x+shoot.l*10*d,y=shoot.y+shoot.l*4.5*d;const g=sc.createLinearGradient(x,y,x-110*d,y-50*d);g.addColorStop(0,"rgba(255,225,238,1)");g.addColorStop(1,"rgba(255,225,238,0)");sc.globalAlpha=1;sc.strokeStyle=g;sc.lineWidth=2.2*d;sc.beginPath();sc.moveTo(x,y);sc.lineTo(x-110*d,y-50*d);sc.stroke();if(shoot.l>55)shoot=null}}}
let lastW=innerWidth;
addEventListener("resize",()=>{sizeSky();sizeFx();if(innerWidth!==lastW){lastW=innerWidth;castleArt=null}});sizeSky();requestAnimationFrame(drawSky);

// particle effects
const fx=document.getElementById("fx"),fc=fx.getContext("2d");let bits=[],running=false;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}sizeFx();
const COLS=["#f7b5cd","#fff0f6","#ff5fa2","#8fd6a8","#c3a6ff","#f0bfd6"];
function add(b){if(still)return;bits.push(b);if(!running){running=true;requestAnimationFrame(step)}}
function star(x,y,r){fc.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.4:r;fc.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}fc.closePath();fc.fill()}
function heart(x,y,s){fc.beginPath();fc.moveTo(x,y+s*.3);fc.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);fc.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);fc.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);fc.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);fc.fill()}
function sparkleBurst(n,x=innerWidth/2,y=innerHeight*.45){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*8+2;add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.12,s:Math.random()*4+2,c:COLS[i%6],life:70+Math.random()*40,max:110,k:"star"})}}
function fireworks(n){for(let k=0;k<n;k++)setTimeout(()=>{const x=innerWidth*(.12+Math.random()*.76),y=innerHeight*(.1+Math.random()*.32),c=COLS[k%6],c2=COLS[(k+2)%6];
  for(let i=0;i<80;i++){const a=i/80*6.28,v=Math.random()*1.8+3.4;add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.055,s:2.2,c:i%2?c:c2,life:85+Math.random()*35,max:120,trail:true})}
  for(let i=0;i<20;i++){const a=Math.random()*6.28,v=Math.random()*1.5;add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.02,s:3,c:"#fff0f6",life:140,max:140,k:"star"})}},k*420)}
function hearts(n){for(let i=0;i<n;i++)setTimeout(()=>add({x:Math.random()*innerWidth,y:innerHeight+20,vx:(Math.random()-.5)*.6,vy:-(Math.random()*1.4+1.2),g:-.002,s:Math.random()*10+10,c:i%3?"#ff5fa2":"#f7b5cd",life:420,max:420,k:"heart",w:Math.random()*6.28}),i*130)}
addEventListener("pointermove",e=>{if(Math.random()>.55)return;add({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.4,vy:Math.random()*.9,g:.03,s:Math.random()*2.6+1.4,c:COLS[Math.floor(Math.random()*3)],life:45,max:45,k:"star"})});
addEventListener("pointerdown",e=>{if(e.target.closest("button,input"))return;sparkleBurst(24,e.clientX,e.clientY)});
function step(){fc.globalCompositeOperation="destination-out";fc.fillStyle="rgba(0,0,0,.35)";fc.fillRect(0,0,fx.width,fx.height);fc.globalCompositeOperation="lighter";
  bits=bits.filter(b=>b.life-->0);
  for(const b of bits){
    if(b.orbit){b.a+=b.da;b.r=Math.max(0,b.r+b.dr);b.x=b.cx+Math.cos(b.a)*b.r;b.y=b.cy+Math.sin(b.a)*b.r}
    else{b.vy+=b.g;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;if(b.k==="heart"){b.w+=.04;b.x+=Math.sin(b.w)*.6}}
    fc.globalAlpha=Math.max(0,Math.min(1,b.life/b.max*1.4));fc.fillStyle=b.c;
    if(b.k==="star")star(b.x,b.y,b.s);else if(b.k==="heart"){fc.globalCompositeOperation="source-over";heart(b.x,b.y,b.s);fc.globalCompositeOperation="lighter"}else{fc.beginPath();fc.arc(b.x,b.y,b.s,0,6.28);fc.fill()}}
  fc.globalCompositeOperation="source-over";
  if(bits.length)requestAnimationFrame(step);else{running=false;fc.clearRect(0,0,fx.width,fx.height)}}

function flyLetter(l,from,slotIx){return new Promise(res=>{
  const slot=document.querySelectorAll(".slot")[slotIx];if(still||!slot||!slot.animate){res();return}
  const to=slot.getBoundingClientRect(),el=document.createElement("div");el.className="flyer";el.textContent=l;document.body.appendChild(el);
  const sx=from.left+from.width/2-14,sy=from.top-30,ex=to.left+to.width/2-14,ey=to.top+4;
  el.style.left=sx+"px";el.style.top=sy+"px";
  const a=el.animate([{transform:"translate(0,0) scale(.3) rotate(0)",opacity:0},{transform:`translate(${(ex-sx)*.3}px,${(ey-sy)*.3-60}px) scale(1.8) rotate(200deg)`,opacity:1,offset:.4},{transform:`translate(${ex-sx}px,${ey-sy}px) scale(.8) rotate(360deg)`,opacity:1}],{duration:1100,easing:"cubic-bezier(.5,0,.3,1)"});
  const trail=setInterval(()=>{const r=el.getBoundingClientRect();add({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,g:.02,s:2.5,c:COLS[Math.floor(Math.random()*3)],life:30,max:30,k:"star"})},16);
  a.onfinish=()=>{clearInterval(trail);el.remove();slot.textContent=l;slot.classList.add("lit","pop");sparkleBurst(30,to.left+to.width/2,to.top+to.height/2);res()};
})}

// opening curtain
const cur=document.getElementById("curtain");
const fontsReady=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,2500))]);
fontsReady.then(()=>{go(pageIx);
setTimeout(()=>{cur.classList.add("open");
  // a shower of sparkles bursts out of the parting seam as the panels start to move
  setTimeout(()=>{for(let i=0;i<70;i++)add({x:innerWidth/2+(Math.random()-.5)*8,y:Math.random()*innerHeight,vx:(Math.random()<.5?-1:1)*(Math.random()*5+1.5),vy:(Math.random()-.6)*1.5,g:.04,s:Math.random()*2.6+1.4,c:COLS[i%3],life:60+Math.random()*40,max:100,k:"star"})},350);
  setTimeout(()=>sparkleBurst(80),900);setTimeout(()=>cur.remove(),2500)},still?0:400);});
</script>
