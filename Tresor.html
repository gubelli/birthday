<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Der verzauberte Geburtstagstresor Deluxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout: a storybook that turns one page at a time under an aurora night sky; walking into a fairy-tale castle between pages, staggered entrances, flying letters. Deliberately dark, single theme. */
:root{
  --night:#0d0a1f; --dusk:#1d1640; --ink:#f3ead6; --muted:#b9add6;
  --gold:#e8c26a; --gold-deep:#a9822f; --rose:#e98aa8; --ok:#8fd6a8; --sea:#6fc3d9; --violet:#7a4fb0;
  --display:"Cinzel Decorative","Cinzel",Georgia,serif;
  --label:"Cinzel",Georgia,serif;
  --body:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.5;overflow-x:hidden}
/* aurora */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:.5;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:40vmax;left:5%;top:0;background:radial-gradient(closest-side,#4b2fa0,color-mix(in srgb,#4b2fa0 35%,transparent) 55%,transparent)}
.aurora i:nth-child(2){width:50vmax;height:35vmax;right:0;top:10%;background:radial-gradient(closest-side,#1f6f8b,color-mix(in srgb,#1f6f8b 35%,transparent) 55%,transparent);animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){width:45vmax;height:30vmax;left:30%;top:35%;background:radial-gradient(closest-side,#8b2f63,color-mix(in srgb,#8b2f63 35%,transparent) 55%,transparent);animation-duration:34s;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2) rotate(25deg)}}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0} #fx{z-index:8}
/* walk-in transition: approach the castle gate, then stride down a torch-lit hall */
#walk{position:fixed;inset:0;z-index:7;pointer-events:none}
#hall,.outside,.veil,.flare{position:absolute;inset:0;width:100%;height:100%}
#hall{opacity:0}
.veil{background:radial-gradient(ellipse at 50% 70%,var(--dusk),var(--night) 70%);opacity:0}
.flare{background:radial-gradient(circle at 50% 46%,#fff8e6,#f6dc98 45%,var(--gold));opacity:0}
.outside>svg,.outside>.vault{position:absolute}
.outside>svg *{animation:none!important}
.walking .wrap,.walking .aurora,.walking #sky{visibility:hidden}
/* opening curtain; its top edge stays night blue because Safari tints the iPhone status bar from it */
#curtain{position:fixed;inset:0;z-index:9;display:flex;pointer-events:none}
#curtain b{flex:1;background:repeating-linear-gradient(90deg,#5a1630 0 22px,#781e3f 22px 40px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.5);transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
#curtain.open b:first-child{transform:translateX(-102%)} #curtain.open b:last-child{transform:translateX(102%)}
#curtain::after{content:"";position:absolute;inset:0 0 auto;height:56px;background:linear-gradient(180deg,var(--night),#5a1630);border-bottom:3px solid var(--gold);transition:transform 1.4s .4s}
#curtain.open::after{transform:translateY(-110%)}
.wrap{position:relative;z-index:1;box-sizing:border-box;min-height:100%;max-width:560px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-direction:column;align-items:center;gap:8px}
.eyebrow{font-family:var(--label);letter-spacing:.22em;text-transform:uppercase;font-size:.76rem;color:var(--gold)}
.letters{display:flex;justify-content:center;gap:8px}
.slot{width:42px;height:50px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--gold);background:color-mix(in srgb,var(--night) 70%,transparent);transition:transform .5s,box-shadow .5s;position:relative;overflow:hidden}
.slot::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,244,210,.55) 50%,transparent 70%);transform:translateX(-120%)}
.slot.lit{box-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-3px)}
.slot.lit::after{animation:shine 3.5s ease-in-out infinite}
.slot.lit:nth-child(2)::after{animation-delay:.25s}.slot.lit:nth-child(3)::after{animation-delay:.5s}.slot.lit:nth-child(4)::after{animation-delay:.75s}.slot.lit:nth-child(5)::after{animation-delay:1s}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.slot.pop{animation:pop .8s ease}
@keyframes pop{40%{transform:scale(1.45) translateY(-8px) rotate(-6deg);box-shadow:0 0 30px var(--gold)}}
.flyer{position:fixed;z-index:9;font-family:var(--display);color:var(--gold);font-size:2.4rem;text-shadow:0 0 18px var(--gold),0 0 40px var(--rose);pointer-events:none}
/* header + card fill exactly the visible screen; the restart button waits below the fold */
.screen{display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.stage{position:relative;flex:1;perspective:1200px;display:flex;flex-direction:column}
.stage>.page{flex:1;justify-content:center}
.page{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:18px 18px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--dusk) 88%,transparent),color-mix(in srgb,var(--night) 92%,transparent));box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 6px color-mix(in srgb,var(--night) 60%,transparent);position:relative;overflow:hidden;transform-style:preserve-3d}
.page > *{animation:enter .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*120ms + 150ms)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96);filter:blur(6px)}}
.page.shake{animation:shake .5s}
@keyframes shake{15%,55%{transform:translateX(-10px) rotate(-1deg)}35%,75%{transform:translateX(10px) rotate(1deg)}}
.page.wrong{box-shadow:0 0 0 2px var(--rose),0 0 40px color-mix(in srgb,var(--rose) 50%,transparent)}
.artbox{width:min(100%,280px,30vh);width:min(100%,280px,30dvh);transition:transform .25s ease-out;transform-style:preserve-3d}
.art{width:100%;height:auto;overflow:visible;display:block;will-change:transform}
.artbox.wide{width:min(100%,360px,38vh);width:min(100%,360px,38dvh)}
.bigcastle .gL,.bigcastle .gR{transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.bigcastle.open .gL,.bigcastle.open .gR{transform:scaleX(.06)}
.bigcastle .spill{opacity:0;transition:opacity 1.2s .3s}
.bigcastle.open .spill{opacity:1}
.dust{stroke-dasharray:1.5 7;animation:dust 2.4s linear infinite}
@keyframes dust{to{stroke-dashoffset:-34}}
.word{white-space:nowrap;display:inline-block}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.8rem,7.5vw,2.6rem)}
h2{font-size:clamp(1.35rem,5.5vw,1.8rem);color:var(--gold)}
.ch{display:inline-block;background:linear-gradient(180deg,#fff4d2,var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both,wave 3.2s ease-in-out infinite;animation-delay:calc(var(--c)*55ms + 400ms),calc(var(--c)*90ms + 1.6s)}
h2 .ch{background:none;color:var(--gold);-webkit-background-clip:initial;background-clip:initial}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-20deg) scale(.4);filter:blur(4px)}}
@keyframes wave{50%{transform:translateY(-4px)}}
.lead{margin:0;max-width:34ch;font-size:1.08rem;color:var(--muted);font-style:italic}
.verse{margin:0;font-size:1.15rem;line-height:1.42;max-width:32ch;display:flex;flex-direction:column}
.verse span{animation:line 1s ease both;animation-delay:calc(var(--l)*380ms + 700ms)}
.verse span:last-child{color:var(--gold);font-style:italic}
@keyframes line{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:380px}
input{flex:1 1 170px;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:6px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--night);color:var(--ink);text-align:center;transition:box-shadow .3s,border-color .3s}
input:focus{border-color:var(--gold);box-shadow:0 0 20px color-mix(in srgb,var(--gold) 35%,transparent)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:var(--label);font-weight:700;letter-spacing:.08em;font-size:.85rem;padding:11px 18px;border-radius:6px;border:0;cursor:pointer;background:linear-gradient(110deg,var(--gold-deep),var(--gold) 40%,#fff4d2 50%,var(--gold) 60%,var(--gold-deep));background-size:250% 100%;color:var(--night);transition:transform .2s,box-shadow .2s;animation:btn 3s linear infinite}
@keyframes btn{to{background-position:-250% 0}}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 22px color-mix(in srgb,var(--gold) 60%,transparent)}
button.ghost{background:transparent;color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);animation:none}
button.big{font-size:1rem;padding:14px 24px;box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent);animation:btn 3s linear infinite,pulse 2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px transparent}}
.feedback{margin:0;min-height:1.5em;font-style:italic;color:var(--muted)}
.feedback.bad{color:var(--rose)} .feedback.good{color:var(--ok)}
.hint{margin:0;font-size:1.05rem;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--gold) 25%,transparent);padding-top:8px;max-width:32ch;animation:enter .6s both}
.sign{font-style:italic;color:var(--rose);font-size:1.35rem!important}
.reveal p{margin:0;max-width:36ch;font-size:1.2rem}
.foot{display:flex;justify-content:center;padding-top:96px}
.foot button{font-size:.75rem;padding:8px 12px}
/* illustration motion */
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sway{transform-origin:top center;animation:sway 3.6s ease-in-out infinite}
.sway.b{animation-duration:4.4s;animation-delay:-1s}.sway.c{animation-duration:3.1s;animation-delay:-2s}
@keyframes sway{50%{transform:rotate(4deg)}}
.rise{animation:rise 7s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(-120px);opacity:0}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.55}}
.smoke{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 3.5s ease-in-out infinite}
@keyframes draw{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-220;opacity:0}}
.bubble{animation:bubble 4.5s ease-in infinite}
@keyframes bubble{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-110px);opacity:0}}
.fall{animation:fall 6s linear infinite}
@keyframes fall{from{transform:translate(0,-10px) rotate(0);opacity:0}10%{opacity:1}to{transform:translate(-40px,130px) rotate(260deg);opacity:0}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
/* vault door: frame, light core, rays, two leaves that swing out in 3D, a lock dial on the seam */
.vault{position:relative;width:100%;aspect-ratio:240/170;perspective:700px}
.vault>*{position:absolute}
.vf{inset:0;width:100%;height:100%;overflow:visible}
.core,.leaf{left:25.833%;top:14.118%;width:48.333%;height:85.882%}
.core{border-radius:50% 50% 0 0/39.73% 39.73% 0 0;background:radial-gradient(ellipse at 50% 62%,#fffbea,#ffe3a0 35%,var(--gold) 70%,var(--gold-deep));opacity:0;transition:opacity .6s}
.heartc{position:absolute;left:33%;top:40%;width:34%;height:auto}
.rays{left:50%;top:64.7%;width:320%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,236,180,.3) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 12%,transparent 70%);mask:radial-gradient(closest-side,#000 12%,transparent 70%);opacity:0;transition:opacity 1.2s .3s;pointer-events:none}
.leaf{width:24.167%;transition:transform 1.5s cubic-bezier(.45,0,.15,1)}
.leaf.l{transform-origin:0 50%}
.leaf.r{left:50%;transform-origin:100% 50%}
.leaf svg,.dial svg{display:block;width:100%;height:100%;overflow:visible}
.leaf .band{transition:stroke .5s}
.seam{left:calc(50% - 1px);top:14.118%;width:2px;height:85.882%;background:#fff3cf;box-shadow:0 0 10px 3px rgba(255,226,150,.85);opacity:0;transition:opacity .5s}
.dial{left:50%;top:65.88%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);transition:opacity .4s,transform .5s}
.vault.unlock .core,.vault.unlock .seam{opacity:1}
.vault.unlock .band{stroke:#ffe9a8}
.vault.open .leaf.l{transform:rotateY(-112deg)}
.vault.open .leaf.r{transform:rotateY(112deg)}
.vault.open .seam{opacity:0}
.vault.open .dial{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
.vault.open .rays{opacity:1;animation:rays 14s linear infinite}
.vault.open .heartc{animation:beat 1.1s ease-in-out infinite}
@keyframes rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes beat{30%{transform:scale(1.14)}60%{transform:scale(.98)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#curtain{display:none}}
</style>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");

function letters(popIx){

  R.forEach((r,i)=>{const s=document.createElement("div");const on=word||i<solvedCount()&&i!==popIx;s.className="slot"+(on?" lit":"");s.textContent=word?word[i]:on?r.l:"?";L.appendChild(s)});

// close the iPhone keyboard and scroll up; Safari can shift the page again once the keyboard has gone, so scroll once more then
function toTop(){
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  window.scrollTo({top:0,behavior:still?"auto":"smooth"});
  return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;window.scrollTo({top:0});res()};
    if(window.visualViewport)visualViewport.addEventListener("resize",()=>setTimeout(fin,300),{once:true});
    setTimeout(fin,650)})
}
function stagger(p){[...p.children].forEach((c,i)=>c.style.setProperty("--i",i))}
function tilt(p){const box=p.querySelector(".artbox");if(!box||still)return;
  p.addEventListener("pointermove",e=>{const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;box.style.transform=`rotateY(${x*18}deg) rotateX(${-y*14}deg) translateZ(20px)`});
  p.addEventListener("pointerleave",()=>box.style.transform="")}
function wrong(p,fb,msg){fb.className="feedback bad";fb.textContent=msg;p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake","wrong");setTimeout(()=>p.classList.remove("wrong"),900)}

function build(ix){
  const p=document.createElement("section");p.className="page";
  if(ix===0){
    p.innerHTML=`<div class="artbox wide">${bigCastle("h")}</div><h1>${chars("Der verzauberte")}<br>${chars("Geburtstagstresor")}</h1><p class="lead">Irgendwo in deinen Lieblingsgeschichten ist ein Geschenk eingeschlossen. Brich fünf Siegel, indem du die Figur in jedem Rätsel errätst. Jedes Siegel schenkt dir einen Buchstaben.</p><button class="big" id="go">Das Märchen beginnt</button>`;
    p.querySelector("#go").onclick=()=>go(1);
  } else if(ix<=N){
    const r=R[ix-1];
    p.innerHTML=`<div class="artbox">${ART[r.art]}</div><span class="eyebrow">Siegel ${ix} · ${r.t}</span><p class="verse"></p><form><input id="ans" placeholder="Name der Figur" autocomplete="off" aria-label="Antwort"><button>Siegel brechen</button><button type="button" class="ghost" id="tip">Tipp</button></form><p class="feedback" aria-live="polite"></p>`;
    const v=p.querySelector(".verse");r.v.split("\n").forEach((t,i)=>{const s=document.createElement("span");s.style.setProperty("--l",i);s.textContent=t;v.appendChild(s)});

        await up;const ir=inp.getBoundingClientRect();sparkleBurst(90,ir.left+ir.width/2,ir.top);await flyLetter(r.l,ir,ix-1);await wait(500);go(ix+1,ix-1)}
      else wrong(p,fb,val?"Das Siegel hält. Versuch einen anderen Namen.":"Gib zuerst einen Namen ein.")};
    p.querySelector("#tip").onclick=()=>{if(!p.querySelector(".hint")){const h=document.createElement("p");h.className="hint";h.textContent="Tipp: "+r.h;p.appendChild(h)}};
  } else if(ix===6){
    p.innerHTML=`<div class="artbox">${vaultDoor()}</div><h2>${chars("Die Tresortür")}</h2><p class="lead">Alle fünf Siegel sind gebrochen. Ordne deine Buchstaben zu dem Wort, aus dem Wünsche gemacht sind, und sprich es an der Tür aus.</p><form><input id="final" placeholder="Das Zauberwort" autocomplete="off" aria-label="Zauberwort"><button>Öffnen</button></form><p class="feedback" aria-live="polite"></p>`;
    const f=p.querySelector("form"),fb=p.querySelector(".feedback");

      if(norm(f.querySelector("input").value)===FINAL){const up=toTop();f.querySelectorAll("button,input").forEach(x=>x.disabled=true);fb.className="feedback good";fb.textContent="Die Tür öffnet sich …";
        if(still){go(7,null,true);return}
        await up;await spellWord();await wait(450);await openVault(p.querySelector(".vault"))}
      else wrong(p,fb,"Die Tür rührt sich nicht. Tipp: Man hat ihn nachts, und manchmal wird er wahr.")};
  } else {
    p.classList.add("reveal");
    p.innerHTML=`<div class="artbox wide">${bigCastle("v",true)}</div><span class="eyebrow">Der Tresor ist offen</span><h2>${chars("Alles Liebe zum Geburtstag,")}<br>${chars("mein Schatz")}</h2><p>Du hast jedes Rätsel gelöst, so wie du jeden gewöhnlichen Tag ein bisschen verzauberst. Ich wünsche dir für dieses Jahr Abenteuer, die einen ganzen Film füllen, Lachen in jedem Kapitel und ein Happy End, das einfach weitergeht.</p><p>Hör nie auf, gross zu träumen. Ich bin bei jedem deiner Träume an deiner Seite.</p><p class="sign">In Liebe, Fabian</p><button id="more">Noch mehr Feuerwerk</button>`;

let busy=false;
async function go(ix,popIx,fromFlash){
  if(busy)return;busy=true;
  const old=stage.querySelector(".page");
  const swap=()=>{pageIx=ix;save();letters(popIx);const p=build(ix);if(old)old.remove();stage.appendChild(p);window.scrollTo({top:0});
    if(popIx!=null){const s=document.querySelectorAll(".slot")[popIx];s.textContent=R[popIx].l;s.classList.add("lit","pop")}
    const inp=p.querySelector("input");if(inp&&old&&matchMedia("(pointer:fine)").matches)setTimeout(()=>inp.focus({preventScroll:true}),1200);
    if(ix===7){setTimeout(()=>fireworks(8),300);setTimeout(()=>hearts(40),900)}};
  if(!old||still||fromFlash){swap();busy=false;return}
  await walkIn(old,swap,ix);window.scrollTo({top:0});busy=false;
}
document.getElementById("reset").onclick=()=>go(0);

// walking into the castle: up to the gate on the first step, then down a torch-lit hall to a glowing door
const walk=document.getElementById("walk"),hallC=document.getElementById("hall"),hc=hallC.getContext("2d"),outside=walk.querySelector(".outside");
const ease=t=>t<.5?2*t*t:1-(-2*t+2)**2/2;
const smooth=(a,b,t)=>{t=Math.min(1,Math.max(0,(t-a)/(b-a)));return t*t*(3-2*t)};
function fadeTo(el,to,ms){const a=el.animate([{opacity:getComputedStyle(el).opacity},{opacity:to}],{duration:ms,easing:"ease",fill:"forwards"});return a.finished.then(()=>{el.style.opacity=to;a.cancel()})}

async function walkIn(old,swap,ix){
  walk.hidden=false;
  const gate=pageIx===0&&old.querySelector(".bigcastle");
  const hide=()=>document.body.classList.add("walking");
  if(gate){await approach(gate);hide()}
  else{old.animate([{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"scale(1.08)",filter:"blur(6px)"}],{duration:550,easing:"ease-in",fill:"forwards"});fadeTo(hallC,1,500).then(hide)}
  await hall(gate?2600:2300,!!gate,{...HALL,...HALLS[ix===0?"start":ix<=N?R[ix-1].art:"door"]});
  document.body.classList.remove("walking");swap();await fadeTo(hallC,0,700);walk.hidden=true;
}

async function approach(src){
  const box=src.closest(".artbox");box.style.transition="none";box.style.transform="";
  const r=src.getBoundingClientRect();
  outside.innerHTML=`<i class="veil"></i>${bigCastle("o",false,true)}<i class="flare"></i>`;
  const [veil,svg,flare]=outside.children;
  const gx=r.width*GATE[0],gy=r.height*GATE[1],tx=innerWidth/2-r.left-gx,ty=innerHeight*.62-r.top-gy,S=Math.max(2.5,innerWidth*.42/(r.width*44/320));
  Object.assign(svg.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",transformOrigin:`${gx}px ${gy}px`});
  fadeTo(veil,1,700);

function hearts(n){for(let i=0;i<n;i++)setTimeout(()=>add({x:Math.random()*innerWidth,y:innerHeight+20,vx:(Math.random()-.5)*.6,vy:-(Math.random()*1.4+1.2),g:-.002,s:Math.random()*10+10,c:i%3?"#e98aa8":"#e8c26a",life:420,max:420,k:"heart",w:Math.random()*6.28}),i*130)}
addEventListener("pointermove",e=>{if(Math.random()>.55)return;add({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.4,vy:Math.random()*.9,g:.03,s:Math.random()*2.6+1.4,c:COLS[Math.floor(Math.random()*3)],life:45,max:45,k:"star"})});
addEventListener("pointerdown",e=>{if(e.target.closest("button,input"))return;sparkleBurst(24,e.clientX,e.clientY)});
function step(){fc.globalCompositeOperation="destination-out";fc.fillStyle="rgba(0,0,0,.35)";fc.fillRect(0,0,fx.width,fx.height);fc.globalCompositeOperation="lighter";
  bits=bits.filter(b=>b.life-->0);
  for(const b of bits){
    if(b.orbit){b.a+=b.da;b.r=Math.max(0,b.r+b.dr);b.x=b.cx+Math.cos(b.a)*b.r;b.y=b.cy+Math.sin(b.a)*b.r}
    else{b.vy+=b.g;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;if(b.k==="heart"){b.w+=.04;b.x+=Math.sin(b.w)*.6}}
    fc.globalAlpha=Math.max(0,Math.min(1,b.life/b.max*1.4));fc.fillStyle=b.c;
    if(b.k==="star")star(b.x,b.y,b.s);else if(b.k==="heart"){fc.globalCompositeOperation="source-over";heart(b.x,b.y,b.s);fc.globalCompositeOperation="lighter"}else{fc.beginPath();fc.arc(b.x,b.y,b.s,0,6.28);fc.fill()}}
  fc.globalCompositeOperation="source-over";
  if(bits.length)requestAnimationFrame(step);else{running=false;fc.clearRect(0,0,fx.width,fx.height)}}

function flyLetter(l,from,slotIx){return new Promise(res=>{
  const slot=document.querySelectorAll(".slot")[slotIx];if(still||!slot||!slot.animate){res();return}
  const to=slot.getBoundingClientRect(),el=document.createElement("div");el.className="flyer";el.textContent=l;document.body.appendChild(el);
  const sx=from.left+from.width/2-14,sy=from.top-30,ex=to.left+to.width/2-14,ey=to.top+4;
  el.style.left=sx+"px";el.style.top=sy+"px";
  const a=el.animate([{transform:"translate(0,0) scale(.3) rotate(0)",opacity:0},{transform:`translate(${(ex-sx)*.3}px,${(ey-sy)*.3-60}px) scale(1.8) rotate(200deg)`,opacity:1,offset:.4},{transform:`translate(${ex-sx}px,${ey-sy}px) scale(.8) rotate(360deg)`,opacity:1}],{duration:1100,easing:"cubic-bezier(.5,0,.3,1)"});
  const trail=setInterval(()=>{const r=el.getBoundingClientRect();add({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,g:.02,s:2.5,c:COLS[Math.floor(Math.random()*3)],life:30,max:30,k:"star"})},16);
  a.onfinish=()=>{clearInterval(trail);el.remove();slot.textContent=l;slot.classList.add("lit","pop");sparkleBurst(30,to.left+to.width/2,to.top+to.height/2);res()};
})}

// opening curtain
const cur=document.getElementById("curtain");
const fontsReady=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,2500))]);
fontsReady.then(()=>{go(pageIx);
setTimeout(()=>{cur.classList.add("open");setTimeout(()=>{sparkleBurst(80);},700);setTimeout(()=>cur.remove(),2200)},still?0:400);});
</script>
